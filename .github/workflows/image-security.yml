name: Release image security
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "infra/Dockerfile*"
      - "apps/**"
      - "packages/**"
      - "package*.json"
      - ".github/workflows/image-security.yml"
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        component: [web, worker, renderer, antivirus]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build exact image being checked
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          if [ "$COMPONENT" = renderer ]; then
            docker build -f infra/Dockerfile.renderer -t release-image .
          elif [ "$COMPONENT" = antivirus ]; then
            docker pull clamav/clamav:1.4@sha256:8ad6197396974726c35d017e50aaaaf4b91745726a04faec8480c203edd98052
            docker tag clamav/clamav:1.4@sha256:8ad6197396974726c35d017e50aaaaf4b91745726a04faec8480c203edd98052 release-image
          else
            docker build -f infra/Dockerfile --target "$COMPONENT" -t release-image .
          fi
      - name: Reject known HIGH and CRITICAL findings, including unfixed ones
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 image --exit-code 1 --severity HIGH,CRITICAL release-image
