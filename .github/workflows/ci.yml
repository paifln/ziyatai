name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24.21.0', cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13.8'}
      - run: npm ci
      - run: pip install -r apps/worker/requirements.txt python-docx==1.2.0 reportlab==5.0.1 xlwt==1.3.0 pytest==9.1.1
      - run: npm run fixtures
      - run: npm run lint && npm run typecheck && npm test && npm run test:parser
      - run: npm run build && node scripts/build-worker.mjs
      - run: npm audit --audit-level=moderate
      - run: python scripts/scan-secrets.py
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24.21.0', cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13.8'}
      - run: npm ci
      - run: pip install -r apps/worker/requirements.txt -r tests/requirements.txt
      - run: npm run fixtures && npm run local:setup && npm run infra:up
      - run: npx tsx scripts/enable-local-renderer.ts
      - run: docker compose -f infra/compose.tools-local.yml --env-file .env.local up -d --build
      - run: npm run migrate
      - run: npm run worker > /tmp/ziyatai-worker.log 2>&1 &
      - run: npx tsx --env-file=.env.local scripts/queue-check.ts && npx tsx --env-file=.env.local scripts/restore-check.ts
      - run: docker compose -f infra/compose.local.yml --env-file .env.local logs --tail=10
