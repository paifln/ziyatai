name: Checks
on:
  push:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  # Let main finish a complete validation; keep only the newest pending push.
  # Superseded feature/PR runs can still be cancelled.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24.22.0", cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13.8" }
      - run: npm ci
      - run: npm run check:source && npm run check:client && npm run check:unused
      - run: pip install -r apps/worker/requirements.lock.txt -r tests/requirements.txt
      - run: npm run fixtures
      - run: npm run lint && npm run typecheck && npm test && npm run test:parser && npm run test:security
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build && node scripts/build-worker.mjs
      - name: Package Next.js with the Netlify adapter (offline, synthetic origins)
        env:
          NETLIFY_SITE_ID: b0f3e39e-36bd-4d5e-bd5f-6c938fdc81bc
          ZIYATAI_API_ORIGIN: https://api.example.test
          UPLOAD_ORIGIN: https://storage.example.test
          NETLIFY_PROXY_SECRET: local-fixture-key-only-never-a-production-secret
          DO_NOT_TRACK: "1"
        run: npx --yes netlify-cli@27.12.1 build --offline
      - run: npm audit --audit-level=moderate
      - run: python scripts/scan-secrets.py
  integration:
    runs-on: ubuntu-latest
    env:
      HOSTNAME: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24.22.0", cache: npm }
      - uses: supabase/setup-cli@v1
        with: { version: "3.0.0" }
      - run: npm ci
      - run: supabase start
      - name: Prepare isolated local Supabase credentials
        run: |
          mkdir -p .local
          supabase status -o json > .local/supabase-status.json
          npx tsx scripts/supabase/prepare-ci.ts
      - run: npm run migrate
      - name: Check database transactions, migration and queue isolation
        run: |
          npx tsx --env-file=.env.local scripts/supabase/local-check.ts
          npx tsx --env-file=.env.local scripts/db-resilience-check.ts
          npx tsx --env-file=.env.local scripts/queue-idempotency-check.ts
          npx tsx --env-file=.env.local scripts/session-read-budget-check.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Exercise password authentication against local Supabase
        run: |
          node scripts/qa-web-runtime.mjs start main > .local/qa-control.log 2>&1 &
          npx tsx scripts/supabase/auth-smoke.ts .env.local
      - name: Stop owned QA processes
        if: always()
        run: node scripts/qa-web-runtime.mjs finish
      - name: Stop local Supabase
        if: always()
        run: supabase stop
  railway-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24.22.0" }
      - run: npm --prefix .railway ci
      - run: npm --prefix .railway run check
