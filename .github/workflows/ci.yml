name: Checks
on:
  push:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24.22.0", cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13.8" }
      - run: npm ci
      - run: npm run check:source && npm run check:railway
      - run: pip install -r apps/worker/requirements.lock.txt -r tests/requirements.txt
      - run: npm run fixtures
      - run: npm run lint && npm run typecheck && npm test && npm run test:parser
      - run: npm run build && node scripts/build-worker.mjs
      - name: Package Next.js with the Netlify adapter (offline, synthetic origins)
        env:
          NETLIFY_SITE_ID: b0f3e39e-36bd-4d5e-bd5f-6c938fdc81bc
          ZIYATAI_API_ORIGIN: https://api.example.test
          UPLOAD_ORIGIN: https://storage.example.test
          NETLIFY_PROXY_SECRET: local-fixture-key-only-never-a-production-secret
          DO_NOT_TRACK: "1"
        run: npx --yes netlify-cli@27.12.1 build --offline
      - run: npm audit --audit-level=moderate
      - run: python scripts/scan-secrets.py
  integration:
    runs-on: ubuntu-latest
    env:
      APP_ENV: local
      POSTGRES_IMAGE: ziyatai-postgres:ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24.22.0", cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13.8" }
      - run: npm ci
      - run: pip install -r apps/worker/requirements.lock.txt -r tests/requirements.txt
      - run: docker build -f infra/Dockerfile.postgres -t ziyatai-postgres:ci .
      - run: npm run fixtures && npm run local:setup && npm run infra:up
      - run: npx tsx scripts/enable-local-renderer.ts
      - run: npx tsx scripts/prepare-local-containers.ts
      - run: docker compose -f infra/compose.tools-local.yml --env-file .env.local up -d --build
      - run: npm run migrate
      - run: npx tsx --env-file=.env.local scripts/configure-storage.ts
      - run: npm run worker > /tmp/ziyatai-worker.log 2>&1 &
      - run: npx tsx --env-file=.env.local scripts/queue-check.ts && npx tsx --env-file=.env.local scripts/restore-check.ts
      - run: npx tsx --env-file=.env.local scripts/upload-cleanup-check.ts
      - run: npx tsx --env-file=.env.local scripts/auth-reset-check.ts
      - run: npx tsx --env-file=.env.local scripts/check-renderer-boundary.ts
      - run: npm run build
      - run: npm run start > /tmp/ziyatai-web.log 2>&1 &
      - run: npx playwright install --with-deps chromium
      # The full PDF/TNR suite needs licensed fonts and runs on the local/staging host.
      - run: npx playwright test tests/e2e/design.spec.ts tests/e2e/direct-upload.spec.ts tests/e2e/ui.spec.ts tests/e2e/security.spec.ts tests/e2e/revision.spec.ts tests/e2e/usability.spec.ts tests/e2e/release-review.spec.ts tests/e2e/themes.spec.ts tests/e2e/approval-state.spec.ts tests/e2e/print-and-assessment.spec.ts
      - run: docker compose -f infra/compose.local.yml --env-file .env.local logs --tail=10
