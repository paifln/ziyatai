name: ziyatai-laptop
services:
  renderer:
    image: ziyatai-renderer:laptop
    restart: unless-stopped
    env_file: ../.local/renderer.env
    ports: ["127.0.0.1:18090:8090"]
    volumes: ["${FONT_DIRECTORY:-../.local/fonts}:/usr/local/share/fonts/licensed:ro"]
    read_only: true
    tmpfs: ["/tmp:size=512m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
  web:
    image: ziyatai-web:laptop
    restart: unless-stopped
    env_file:
      - path: ../.local/hosting/laptop-container.env
        format: raw
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports: ["127.0.0.1:3001:3000"]
    read_only: true
    tmpfs: ["/tmp:size=512m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 128
  worker:
    image: ziyatai-worker:laptop
    restart: unless-stopped
    env_file:
      - path: ../.local/hosting/laptop-container.env
        format: raw
    read_only: true
    tmpfs: ["/tmp:size=512m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 128
  antivirus:
    image: clamav/clamav:1.4@sha256:8ad6197396974726c35d017e50aaaaf4b91745726a04faec8480c203edd98052
    restart: unless-stopped
    ports: ["127.0.0.1:13310:3310"]
    volumes: ["antivirus-data:/var/lib/clamav"]
    mem_limit: 2g
volumes:
  antivirus-data:
