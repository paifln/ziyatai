# Run on the chosen Kazakhstan host. Provision managed private S3 separately.
name: ziyatai-production
services:
  web:
    image: ziyatai-web:${RELEASE:?required}
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: web
      args:
        UPLOAD_ORIGIN: "${UPLOAD_ORIGIN:?Set public HTTPS storage origin}"
        LEGAL_OPERATOR_NAME: "${LEGAL_OPERATOR_NAME:-}"
        LEGAL_CONTACT_EMAIL: "${LEGAL_CONTACT_EMAIL:-}"
    restart: unless-stopped
    env_file: ../.env.production
    environment:
      NODE_ENV: production
      APP_ENV: production
      SCAN_REQUIRED: "true"
      ALLOW_DEMO: "false"
      PARSER_CONTAINER_IMAGE: ""
      RENDER_CONTAINER_IMAGE: ""
    volumes: ["clam-db:/var/lib/clamav:ro"]
    tmpfs: ["/tmp:size=512m,mode=1777"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    networks: [egress,edge,render,av]
  worker:
    image: ziyatai-worker:${RELEASE:?required}
    build: {context: .., dockerfile: infra/Dockerfile, target: worker}
    restart: unless-stopped
    env_file: ../.env.production
    environment:
      NODE_ENV: production
      APP_ENV: production
      SCAN_REQUIRED: "true"
      ALLOW_DEMO: "false"
      PARSER_CONTAINER_IMAGE: ""
      RENDER_CONTAINER_IMAGE: ""
    tmpfs: ["/tmp:size=512m,mode=1777"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 128
    networks: [egress,render,av]
  renderer:
    image: ziyatai-renderer:${RELEASE:?required}
    build: {context: .., dockerfile: infra/Dockerfile.renderer}
    restart: unless-stopped
    environment:
      RENDERER_TOKEN: ${RENDERER_TOKEN:?required}
    volumes:
      - ${LICENSED_FONT_DIR:?required}:/usr/local/share/fonts/licensed:ro
    tmpfs: ["/tmp:size=512m,mode=1777"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    networks: [render]
  clam-update:
    image: clamav/clamav:1.4@sha256:b5b910ce43d595bf8a2fe401e34db56434602b2c755b7c2b07f00c917d04d469
    restart: unless-stopped
    volumes: ["clam-db:/var/lib/clamav"]
    networks: [egress,av]
  proxy:
    image: ziyatai-proxy:${RELEASE:?required}
    build: {context: .., dockerfile: infra/Dockerfile.proxy}
    restart: unless-stopped
    ports: ["80:80","443:443"]
    environment:
      APP_HOST: ${APP_HOST:?required}
      APP_URL: ${APP_URL:?required}
    volumes: ["${CADDY_CONFIG:-./Caddyfile}:/etc/caddy/Caddyfile:ro","caddy-data:/data","caddy-config:/config"]
    networks: [edge]
volumes:
  clam-db:
  caddy-data:
  caddy-config:
networks:
  edge:
  egress:
  render: {internal: true}
  av: {internal: true}
