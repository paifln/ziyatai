# Supabase owns Auth/Postgres/Storage. No local postgres, Garage or mail service.
# Put filled .env.supabase.local values into .env.production before cutover.
name: ziyatai-supabase
services:
  web:
    extends: { file: compose.production.yml, service: web }
    depends_on: !reset {}
    networks: !override [egress, edge, render, av]
  worker:
    extends: { file: compose.production.yml, service: worker }
    depends_on: !reset {}
    networks: !override [egress, render, av]
  renderer:
    extends: { file: compose.production.yml, service: renderer }
  clam-update:
    extends: { file: compose.production.yml, service: clam-update }
  proxy:
    extends: { file: compose.production.yml, service: proxy }
volumes:
  clam-db:
  caddy-data:
  caddy-config:
networks:
  edge:
  egress:
  render: { internal: true }
  av: { internal: true }
