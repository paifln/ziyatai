name: ziyatai-local
services:
  postgres:
    restart: unless-stopped
    image: ${POSTGRES_IMAGE:-postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336}
    environment:
      POSTGRES_USER: ziyatai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ziyatai
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ziyatai -d ziyatai"]
      interval: 5s
      timeout: 3s
      retries: 20
  storage:
    restart: unless-stopped
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${STORAGE_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${STORAGE_BUCKET}
    ports: ["127.0.0.1:53900:3900"]
    volumes:
      - ../.local/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
  mail:
    restart: unless-stopped
    image: axllent/mailpit:v1.27.8@sha256:6abc8e633df15eaf785cfcf38bae48e66f64beecdc03121e249d0f9ec15f0707
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
    volumes: ["mail:/data"]
    environment:
      MP_DATABASE: /data/mailpit.db
volumes:
  postgres:
    name: ${POSTGRES_VOLUME_NAME:-ziyatai-local_postgres}
  garage-meta:
  garage-data:
  mail:
