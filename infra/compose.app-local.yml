name: ziyatai-runtime
services:
  web:
    image: ziyatai-web:local
    restart: unless-stopped
    env_file: ../.local/docker.env
    environment:
      APP_ENV: local
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports: ["127.0.0.1:3000:3000"]
    read_only: true
    tmpfs: ["/tmp:size=512m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 128
  worker:
    image: ziyatai-worker:local
    restart: unless-stopped
    env_file: ../.local/docker.env
    environment:
      APP_ENV: local
    read_only: true
    tmpfs: ["/tmp:size=512m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 128
