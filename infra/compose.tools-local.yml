name: ziyatai-tools
services:
  renderer:
    image: ziyatai-renderer:local
    build: {context: .., dockerfile: infra/Dockerfile.renderer}
    restart: unless-stopped
    env_file: ../.local/renderer.env
    ports: ["127.0.0.1:18090:8090"]
    volumes: ["${FONT_DIRECTORY:-../.local/fonts}:/usr/local/share/fonts/licensed:ro"]
    read_only: true
    tmpfs: ["/tmp:size=512m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
  antivirus:
    image: clamav/clamav:1.4@sha256:8ad6197396974726c35d017e50aaaaf4b91745726a04faec8480c203edd98052
    restart: unless-stopped
    ports: ["127.0.0.1:13310:3310"]
    mem_limit: 2g
